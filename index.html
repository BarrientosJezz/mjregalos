<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuevo artículo · MJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2a2038;
    --paper: #f4f2f8;
    --card: #ffffff;
    --line: #d9d4e3;
    --gold: #9a7440;
    --ok: #1f7a4d;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece8f4;
      --paper: #1a1424;
      --card: #251d33;
      --line: #3d3350;
      --gold: #d2a869;
      --ok: #5fd39a;
      --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Instrument Sans", system-ui, sans-serif;
    line-height: 1.5;
    padding: 24px 16px 48px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.9rem;
    margin: 8px 0 4px;
  }
  .sub { margin: 0 0 24px; opacity: .75; }
  form {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    display: grid;
    gap: 18px;
  }
  label { display: grid; gap: 6px; font-weight: 500; }
  input[type=text], select, textarea {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
  }
  textarea { min-height: 120px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .hint { font-weight: 400; font-size: .85rem; opacity: .7; }
  .invalid { border-color: var(--err) !important; }
  .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { display: grid; gap: 6px; align-content: start; }
  .photo {
    position: relative;
    aspect-ratio: 1;
    border: 1px dashed var(--line);
    border-radius: 8px;
    display: grid;
    place-items: center;
    overflow: hidden;
    text-align: center;
    font-size: .85rem;
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo .info {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.65); color: #fff;
    font-size: .72rem; padding: 2px 4px;
  }
  .photo .quitar {
    position: absolute; top: 4px; right: 4px;
    width: 28px; height: 28px; padding: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.65);
    font-size: 1.1rem; line-height: 1;
  }
  .pbtns { display: grid; gap: 6px; }
  .pbtns button {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 8px 6px;
    font-size: .85rem;
    font-weight: 500;
  }
  .pbtns button:hover { border-color: var(--gold); }
  button {
    font: inherit;
    font-weight: 600;
    background: var(--gold);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 12px 16px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  [hidden] { display: none !important; }
  input[type=password] {
    font: inherit;
    color: inherit;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
  }
  input[type=password]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #gmsg { min-height: 1.4em; margin: 0; font-weight: 500; color: var(--err); }
  #msg { min-height: 1.4em; font-weight: 500; margin: 0; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); }
</style>
</head>
<body>
<main>
  <h1>Nuevo artículo</h1>
  <p class="sub">Se agrega una fila al catálogo y las fotos se guardan en Drive.</p>

  <form id="gate">
    <label>Clave de acceso
      <input type="password" id="clave" autocomplete="current-password" required>
    </label>
    <button type="submit" id="gbtn">Entrar</button>
    <p id="gmsg" role="status" aria-live="polite"></p>
  </form>

  <form id="f" novalidate hidden>
    <label>Descripción
      <textarea id="descripcion" required></textarea>
    </label>

    <label>Tipo
      <select id="tipo" required>
        <option value="">Elegir tipo</option>
        <option>Collar</option>
        <option>Aretes</option>
        <option>Anillo</option>
        <option>Pack aretes</option>
        <option>Pack collar +arete</option>
      </select>
    </label>

    <div class="row">
      <label>Costo
        <input type="text" id="costo" inputmode="decimal" placeholder="0.00" autocomplete="off" required>
        <span class="hint">Números, hasta 2 decimales</span>
      </label>
      <label>Precio venta
        <input type="text" id="precio" inputmode="decimal" placeholder="0.00" autocomplete="off" required>
        <span class="hint">Números, hasta 2 decimales</span>
      </label>
    </div>

    <div>
      <div style="font-weight:500;margin-bottom:6px">Fotos <span class="hint">(hasta 3)</span></div>
      <div class="photos" id="photos"></div>
    </div>

    <button type="submit" id="btn">Guardar artículo</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<script>
  // ====== CONFIGURACIÓN ======
  const API_URL = 'https://script.google.com/macros/s/AKfycbwP4jf0XkroYh-KZ9ywWKFmDGf7U9d2t8VCiT_es1eH-OQLfQeYYx9J0V0daHVjas8WjA/exec';   // termina en /exec
  let clave = sessionStorage.getItem('clave') || ''; // se pide al abrir; dura mientras la pestaña esté abierta
  const MAX_SIDE  = 1600;   // lado más largo máximo de la foto (px)
  const MIN_SIDE  = 1000;   // no se reduce por debajo de este tamaño
  const TARGET_KB = 600;    // peso objetivo por foto
  const QUALITIES = [0.9, 0.82, 0.75, 0.7]; // calidad JPEG: se baja solo si hace falta

  const $ = (id) => document.getElementById(id);
  const money = /^\d+(\.\d{1,2})?$/;
  const photos = [null, null, null];   // { mime, base64, kb, blob }
  let pending = 0;                     // fotos que se están procesando

  // ====== Fotos: cámara o galería ======
  const photosBox = $('photos');
  for (let i = 0; i < 3; i++) {
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.dataset.i = i;
    slot.innerHTML =
      '<div class="photo"><span>Foto ' + (i + 1) + '</span></div>' +
      '<div class="pbtns">' +
        '<button type="button" data-act="cam">Cámara</button>' +
        '<button type="button" data-act="gal">Galería</button>' +
      '</div>' +
      '<input type="file" accept="image/*" capture="environment" hidden data-src="cam">' +
      '<input type="file" accept="image/*" hidden data-src="gal">';
    photosBox.appendChild(slot);

    slot.querySelectorAll('button').forEach((b) => {
      b.addEventListener('click', () => {
        slot.querySelector('input[data-src="' + b.dataset.act + '"]').click();
      });
    });
    slot.querySelectorAll('input[type=file]').forEach((inp) => {
      inp.addEventListener('change', () => {
        const file = inp.files[0];
        inp.value = '';               // permite elegir la misma foto otra vez
        if (file) setPhoto(i, file);
      });
    });
  }

  function previewBox(i) {
    return photosBox.querySelector('.slot[data-i="' + i + '"] .photo');
  }

  async function setPhoto(i, file) {
    const box = previewBox(i);
    box.innerHTML = '<span>Procesando…</span>';
    pending++;
    try {
      photos[i] = await compress(file);
      renderPhoto(i);
    } catch (err) {
      photos[i] = null;
      renderPhoto(i);
      show(err.message, 'err');
    } finally {
      pending--;
    }
  }

  function renderPhoto(i) {
    const box = previewBox(i);
    const p = photos[i];
    box.innerHTML = '';
    if (!p) {
      box.innerHTML = '<span>Foto ' + (i + 1) + '</span>';
      return;
    }
    const img = new Image();
    img.alt = 'Vista previa de la foto ' + (i + 1);
    img.src = URL.createObjectURL(p.blob);
    const info = document.createElement('div');
    info.className = 'info';
    info.textContent = p.kb + ' KB';
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'quitar';
    x.textContent = '×';
    x.setAttribute('aria-label', 'Quitar foto ' + (i + 1));
    x.addEventListener('click', () => { photos[i] = null; renderPhoto(i); });
    box.append(img, info, x);
  }

  // Solo permite dígitos y un punto con máximo 2 decimales
  ['costo', 'precio'].forEach((id) => {
    $(id).addEventListener('input', (e) => {
      let v = e.target.value.replace(',', '.').replace(/[^\d.]/g, '');
      const p = v.split('.');
      if (p.length > 2) v = p[0] + '.' + p.slice(1).join('');
      if (p[1] !== undefined) v = p[0] + '.' + p[1].slice(0, 2);
      e.target.value = v;
    });
  });

  // ====== Compresión ======
  // Carga la imagen respetando la rotación de la cámara (EXIF)
  async function loadImage(file) {
    if (window.createImageBitmap) {
      try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
      catch (e) { /* se usa el método clásico */ }
    }
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = URL.createObjectURL(file);
    });
  }

  const toBlob = (canvas, q) => new Promise((res) => canvas.toBlob(res, 'image/jpeg', q));

  const blobToBase64 = (blob) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1]);
    r.onerror = () => reject(new Error('No se pudo procesar la imagen'));
    r.readAsDataURL(blob);
  });

  // Primero prueba con buena calidad; si pesa más que TARGET_KB baja la calidad
  // un poco y, si aún pesa de más, reduce las dimensiones (nunca bajo MIN_SIDE).
  async function compress(file) {
    const src = await loadImage(file);
    const w0 = src.width, h0 = src.height;
    let side = Math.min(MAX_SIDE, Math.max(w0, h0));
    let blob = null;

    while (true) {
      const scale = Math.min(1, side / Math.max(w0, h0));
      const c = document.createElement('canvas');
      c.width = Math.round(w0 * scale);
      c.height = Math.round(h0 * scale);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(src, 0, 0, c.width, c.height);

      for (const q of QUALITIES) {
        blob = await toBlob(c, q);
        if (blob && blob.size <= TARGET_KB * 1024) break;
      }
      if (!blob) throw new Error('No se pudo comprimir la imagen');
      if (blob.size <= TARGET_KB * 1024 || side <= MIN_SIDE) break;
      side = Math.max(MIN_SIDE, Math.round(side * 0.85));
    }
    if (src.close) src.close();

    return {
      mime: 'image/jpeg',
      base64: await blobToBase64(blob),
      kb: Math.round(blob.size / 1024),
      blob
    };
  }

  function show(text, cls) {
    const m = $('msg');
    m.textContent = text;
    m.className = cls || '';
  }

  // ====== Candado de clave ======
  async function checkClave(c) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'check', token: c })
    });
    const out = await res.json();
    return out.ok === true;
  }
  function unlock() { $('gate').hidden = true; $('f').hidden = false; }
  function lock() {
    sessionStorage.removeItem('clave');
    clave = '';
    $('f').hidden = true;
    $('gate').hidden = false;
    $('clave').value = '';
    $('clave').focus();
  }

  $('gate').addEventListener('submit', async (e) => {
    e.preventDefault();
    const c = $('clave').value;
    if (!c) return;
    $('gbtn').disabled = true;
    $('gmsg').textContent = 'Verificando…';
    try {
      if (await checkClave(c)) {
        clave = c;
        sessionStorage.setItem('clave', c);
        $('gmsg').textContent = '';
        unlock();
      } else {
        $('gmsg').textContent = 'Clave incorrecta';
      }
    } catch (err) {
      $('gmsg').textContent = 'No se pudo verificar: ' + err.message;
    } finally {
      $('gbtn').disabled = false;
    }
  });

  // Si ya había una clave válida en esta pestaña, entra directo
  if (clave) checkClave(clave).then((ok) => (ok ? unlock() : lock())).catch(() => {});

  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    ['descripcion', 'tipo', 'costo', 'precio'].forEach((id) => $(id).classList.remove('invalid'));

    const descripcion = $('descripcion').value.trim();
    const tipo = $('tipo').value;
    const costo = $('costo').value.trim();
    const precio = $('precio').value.trim();

    let bad = null;
    if (!descripcion) bad = 'descripcion';
    else if (!tipo) bad = 'tipo';
    else if (!money.test(costo)) bad = 'costo';
    else if (!money.test(precio)) bad = 'precio';
    if (bad) {
      $(bad).classList.add('invalid');
      $(bad).focus();
      show('Revisa el campo marcado. Costo y precio: solo números, ej. 12.50', 'err');
      return;
    }

    if (pending > 0) {
      show('Espera un momento: se están procesando las fotos.', 'err');
      return;
    }

    const btn = $('btn');
    btn.disabled = true;
    show('Guardando…');

    try {
      const imagenes = photos.filter(Boolean).map((p) => ({ mime: p.mime, base64: p.base64 }));

      // text/plain evita la petición previa (preflight) que Apps Script no soporta
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ token: clave, descripcion, tipo, costo, precio, imagenes })
      });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error || 'Error al guardar');

      show('Guardado como ' + out.id, 'ok');
      $('f').reset();
      photos.fill(null);
      for (let i = 0; i < 3; i++) renderPhoto(i);
    } catch (err) {
      if (err.message === 'No autorizado') {
        lock();
        $('gmsg').textContent = 'La clave ya no es válida. Ingrésala de nuevo.';
      } else {
        show('No se guardó: ' + err.message, 'err');
      }
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
